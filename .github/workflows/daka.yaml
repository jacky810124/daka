name: Daka

on:
  # Scheduled runs were removed: GitHub's scheduler delayed them by hours, and a
  # check-out that slipped past midnight failed. Trigger via the API instead
  # (cron-job.org calls the workflow_dispatch endpoint on schedule).
  workflow_dispatch:
    inputs:
      punch_type:
        description: 'S = gogo (check-in), E = bye (check-out)'
        required: true
        type: choice
        options:
          - S
          - E

jobs:
  daka:
    runs-on: ubuntu-latest

    env:
      MODULE: ${{ secrets.MODULE}}
      USERNAME: ${{ secrets.USERNAME }}
      PASSWORD: ${{ secrets.PASSWORD }}
      DELAY_START_MINS: ${{ secrets.DELAY_START_MINS }}
      DELAY_END_MINS: ${{ secrets.DELAY_END_MINS }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Daka
        env:
          PUNCH_TYPE: ${{ inputs.punch_type }}
        run: |
          if [ "$PUNCH_TYPE" != "S" ] && [ "$PUNCH_TYPE" != "E" ]; then
            echo "Unknown punch type: '$PUNCH_TYPE'"
            exit 1
          fi
          node src/index.js "$PUNCH_TYPE" > result.md

      - name: Process Daka Result
        id: daka
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          result-encoding: string
          script: |
            const fs = require('fs').promises;

            // Read the result file using promise-based fs
            const result = await fs.readFile('./result.md', 'utf8');

            // Determine result status
            let resultStatus = 'failed';
            if (result.includes('daka success')) {
              console.log('Daka Success');
              resultStatus = 'success';
            } else if (result.includes('no daka')) {
              console.log('No Daka');
              resultStatus = 'no need';
            } else {
              console.log('Daka Failed');
            }

            // Determine clock type
            let clockType = '';
            if (result.includes('gogo')) {
              clockType = 'gogo';
            } else if (result.includes('bye')) {
              clockType = 'bye';
            }

            // Create the issue
            const issue = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Daka ${resultStatus} ${clockType}`,
              body: result
            });

            console.log(`Created issue #${issue.data.number}`);

            return issue.data.number;

      - name: Close issue
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: ${{ steps.daka.outputs.result }},
              state: 'closed'
            })
